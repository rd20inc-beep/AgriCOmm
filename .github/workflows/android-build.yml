# Builds the AgriRice Android app (debug .apk) with Capacitor. Runs ONLY on manual
# dispatch or an `android-v*` tag — never on normal pushes — so zero impact on the
# web CI/CD. Produces an unsigned debug APK; a signed release build (.aab/.apk)
# needs a keystore (add ANDROID_KEYSTORE + passwords secrets and a signing config).
name: Build Android (Capacitor)

on:
  workflow_dispatch:
  push:
    tags:
      - 'android-v*'

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      # The Android WebView is not same-origin with the server, so the web bundle
      # must be built pointing at the real API host.
      VITE_API_URL: https://agricommodities.online
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20

      - name: Setup Java (JDK 17 for AGP)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor (copy web bundle into the Android project)
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: agrice-android-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
