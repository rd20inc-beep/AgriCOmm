name: RiceFlow ERP CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # The DB-backed suites (GL balance, payment engine, money rules, sync, …)
    # are gated on DB_HOST and skip silently without it. Give them a disposable
    # Postgres built from the current migrations so they actually run here.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: riceflow
          POSTGRES_PASSWORD: riceflow
          POSTGRES_DB: riceflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riceflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: riceflow_test
      DB_USER: riceflow
      DB_PASSWORD: riceflow
      # Throwaway value for the test run only — not a real secret.
      JWT_SECRET: FAKE-ci-test-secret
      # Lets the AI read-only role log in so its DB-gated suite runs (fake value).
      AI_DB_PASSWORD: FAKE-ci-ai-secret
      # GitHub's Ubuntu 24 runners block Chromium's user-namespace sandbox (AppArmor);
      # run it the way production does (as root, no sandbox). The PDF tests still
      # assert the renderer's network block.
      PDF_CHROME_NO_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build test database from migrations
        run: npm run migrate

      # --runInBand: the DB suites share one database and assert on totals
      # (cash flow, P&L, ledgers), so running them in parallel workers makes
      # them see each other's rows and fail. Serially the whole run is ~30 s.
      - name: Run tests (unit + DB-backed)
        run: npm test -- --runInBand --ci --json --outputFile=/tmp/jest-results.json

      # A DB-gated suite skips itself wholesale when it cannot see the DB. Make
      # that loud: no suite may be skipped in full. (A single known-bug test
      # skipped with test.skip + a KNOWN-BUG comment does not trip this.)
      - name: Assert no test suite was silently skipped
        run: |
          node -e '
            const r = require("/tmp/jest-results.json");
            const skipped = r.testResults
              .filter((t) => t.assertionResults.length > 0
                && t.assertionResults.every((a) => a.status === "pending" || a.status === "skipped"))
              .map((t) => t.name);
            console.log(`suites=${r.numTotalTestSuites} tests=${r.numTotalTests} passed=${r.numPassedTests} skipped=${r.numPendingTests}`);
            if (skipped.length) {
              console.log("::error::Entire test suites were skipped (is the DB reachable?):\n  " + skipped.join("\n  "));
              process.exit(1);
            }
          '

      # Joi validate() runs with stripUnknown, so a body field a controller reads
      # but its schema does not declare is DELETED before the handler sees it —
      # the feature ships inert, nothing fails, and it surfaces weeks later as
      # "that setting doesn't save". This sweep compares every validated write
      # route's handler against its schema. It has caught real ones (the document
      # bundle order, the shipment contract number, the export freight fields).
      - name: Assert no request field is silently stripped
        run: node scripts/schema-strip-sweep.js

  schema-drift:
    name: Schema Drift Guard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: riceflow
          POSTGRES_PASSWORD: riceflow
          POSTGRES_DB: riceflow_erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U riceflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: riceflow_erp
      DB_USER: riceflow
      DB_PASSWORD: riceflow
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build schema from migrations
        run: npm run migrate

      - name: Assert migrations match committed baseline
        run: |
          npm run --silent schema:fingerprint > /tmp/live.fingerprint
          if ! diff -u schema.baseline.txt /tmp/live.fingerprint; then
            echo ""
            echo "::error::Schema built from migrations does not match backend/schema.baseline.txt."
            echo "A migration changed the schema (lines prefixed '+' above are new, '-' were removed)."
            echo "Regenerate the baseline and commit it:"
            echo "    cd backend && npm run schema:fingerprint > schema.baseline.txt"
            exit 1
          fi
          echo "Migrations build a schema identical to the committed baseline."

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # Lint only the lines this push/PR adds or changes. The codebase carries
  # pre-existing lint errors (≈293 in src/), so a whole-repo or whole-file gate
  # would go red on unrelated legacy code and block deploys; new code must be
  # clean (scripts/lint-changed-lines.mjs). Warnings never fail the job.
  lint-changed:
    name: Lint Changed Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint files changed versus the base
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="origin/$BASE_REF"
            RANGE="$BASE...HEAD"
          elif [ -n "$BEFORE_SHA" ] && ! echo "$BEFORE_SHA" | grep -qE '^0+$' \
               && git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
            RANGE="$BEFORE_SHA..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "Diff range: $RANGE"
          node scripts/lint-changed-lines.mjs "$RANGE"

  deploy:
    name: Deploy to Production
    needs: [test-backend, build-frontend, schema-drift, lint-changed]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # Only ONE deploy may touch the server at a time. Without this, two merges a
    # few minutes apart both SSH in and run `docker-compose build --no-cache`,
    # `up -d --force-recreate` and `docker image prune -f` at once. They collide
    # on the recreate — compose renames the running container to a temporary
    # name and the second run finds it taken:
    #
    #   Conflict. The container name "/<hash>_riceflow-db" is already in use
    #
    # which fails a deploy that had already built successfully, and leaves the
    # site 502 for longer than one recreate should take.
    #
    # cancel-in-progress is FALSE on purpose: a half-finished deploy must be
    # allowed to finish. Cancelling one mid-build could leave the box with new
    # code rsynced but old containers running.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          debug: true
          script: |
            set -e
            cd /opt/riceflow-erp
            git pull origin main
            rsync -a --delete --exclude='.env' --exclude='node_modules' /opt/riceflow-erp/ /root/riceflow-erp/
            cd /root/riceflow-erp
            docker-compose build --no-cache
            docker-compose up -d --force-recreate
            docker image prune -f
            # Schema-drift guard: after migrations run on start, confirm prod's
            # live schema has nothing the migrations baseline doesn't. Catches
            # columns/constraints ALTERed onto prod outside the migration system.
            echo "Waiting for backend to finish migrations..."
            for i in $(seq 1 30); do
              if docker exec riceflow-backend node -e "require('/app/src/config/database').raw('select 1').then(()=>process.exit(0)).catch(()=>process.exit(1))" >/dev/null 2>&1; then
                break
              fi
              sleep 3
            done
            docker exec riceflow-backend node scripts/checkSchemaDrift.js
